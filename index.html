    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            var customProtoFetch = protoFetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return customProtoFetch || protoFetch;
              },
              set: function(fn) {
                customProtoFetch = fn;
              }
            });
          } catch (e2) {}
        }
      })();
    </script>

    <script>
      try {
        var savedTheme = localStorage.getItem('hmp_theme_mode') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
